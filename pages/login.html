<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to RepForge AI and continue your training." />
  <title>Log In — RepForge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-layout">

    <!-- Left decorative panel -->
    <div class="auth-panel" aria-hidden="true">
      <a href="../index.html" class="nav-logo auth-logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">RepForge <em>AI</em></span>
      </a>
      <div class="auth-panel__content">
        <div class="auth-panel__headline">
          <p class="auth-panel__big">Every rep<br>tells the AI<br>something<br>new.</p>
        </div>
        <div class="auth-panel__stats">
          <div class="auth-stat">
            <span class="auth-stat__num">2.4M</span>
            <span class="auth-stat__label">Sessions logged</span>
          </div>
          <div class="auth-stat">
            <span class="auth-stat__num">127K</span>
            <span class="auth-stat__label">Active athletes</span>
          </div>
        </div>
      </div>
      <div class="auth-panel__bg" aria-hidden="true"></div>
    </div>

    <!-- Right form panel -->
    <div class="auth-form-panel">
      <div class="auth-form-wrap">
        <div class="auth-header">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-sub">Log in to continue your program.</p>
        </div>

        <!-- Social auth -->
        <div class="auth-social">
          <button class="social-auth-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
              <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
          <button class="social-auth-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true">
              <path d="M9 0C4.03 0 0 4.03 0 9c0 3.98 2.58 7.35 6.16 8.54.45.08.62-.2.62-.44v-1.55c-2.51.55-3.04-1.21-3.04-1.21-.41-1.04-1-1.32-1-1.32-.82-.56.06-.55.06-.55.9.06 1.38.93 1.38.93.8 1.37 2.1.97 2.61.74.08-.58.31-.97.57-1.19-1.99-.23-4.09-.99-4.09-4.43 0-.98.35-1.78.93-2.4-.09-.23-.4-1.14.09-2.37 0 0 .76-.24 2.5.93A8.7 8.7 0 0 1 9 4.28c.77 0 1.55.1 2.27.3 1.74-1.18 2.5-.93 2.5-.93.49 1.23.18 2.14.09 2.37.58.63.93 1.42.93 2.4 0 3.44-2.1 4.2-4.1 4.43.32.28.6.82.6 1.66v2.45c0 .24.16.52.62.44C15.42 16.35 18 12.98 18 9c0-4.97-4.03-9-9-9z"/>
            </svg>
            Continue with GitHub
          </button>
        </div>

        <div class="auth-divider"><span>or log in with email</span></div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              autocomplete="email"
              required
              placeholder="alex@example.com"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              Password
              <a href="forgot-password.html" class="form-hint form-hint--link">Forgot password?</a>
            </label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                autocomplete="current-password"
                required
                placeholder="••••••••"
              />
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
                <span class="pw-toggle__show">Show</span>
                <span class="pw-toggle__hide" hidden>Hide</span>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--full btn--lg btn--forge" id="loginBtn">
            <span class="btn__text">Log In</span>
            <span class="btn__icon" aria-hidden="true">→</span>
          </button>

          <p id="formError" class="form-error" role="alert" hidden></p>
        </form>

        <p class="auth-switch">
          Don't have an account? <a href="signup.html">Start free — no card needed</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    // Password toggle
    const pwInput  = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    pwToggle.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      pwToggle.querySelector('.pw-toggle__show').hidden = isHidden;
      pwToggle.querySelector('.pw-toggle__hide').hidden = !isHidden;
    });

    // Demo submit
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.querySelector('.btn__text').textContent = 'Logging in…';
      btn.disabled = true;
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    });
  </script>
</body>
</html>
